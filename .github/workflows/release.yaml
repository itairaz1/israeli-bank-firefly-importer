name: Release

on:
  push:
    branches:
      - main
      - next

# Serialize releases per branch: parallel runs race on version tags
# (two runs both computing the same next version).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the branch tip, not the triggering SHA: a run queued behind
          # another release would otherwise be "behind remote" and skip publishing.
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Type check and lint
        run: npm run typecheck && npx eslint src --ext .ts
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 25.0.5
          extra_plugins: |
            @semantic-release/changelog@6.0.2
            @semantic-release/git@10.0.1
            @codedependant/semantic-release-docker@4.3.0
            @semantic-release/npm@13.1.5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
